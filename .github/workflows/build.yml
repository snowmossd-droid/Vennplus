name: Build APK

# Chạy tự động mỗi khi push code, hoặc bấm chạy tay trong tab Actions
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Sinh Gradle wrapper (Gradle 8.4)
        run: gradle wrapper --gradle-version 8.4

      - name: Cấp quyền chạy gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: VennPlus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
