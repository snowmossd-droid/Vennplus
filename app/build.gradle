plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.tiktokstreamer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tiktokstreamer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Thư viện RootEncoder: xử lý capture màn hình + mic + encode + đẩy RTMP
    // https://github.com/pedroSG94/RootEncoder
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.0'

    // WebSocket client dùng để nhận chat từ chat-bridge (xem README phần Chat Bridge)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
