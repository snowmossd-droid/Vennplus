// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

// Repo cho toàn bộ module (app, ...) đã khai báo tập trung ở settings.gradle
// (dependencyResolutionManagement) — không khai lại ở đây để tránh xung đột
// với FAIL_ON_PROJECT_REPOS.

task clean(type: Delete) {
    delete rootProject.buildDir
}
